[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motorping"
version = "0.1.0"
description = "Backend de Motor Ping - gestion de ordenes de trabajo para talleres mecanicos"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    # EmailStr no valida nada sin esto.
    "pydantic[email]",
    "sqlalchemy",
    "alembic",
    # Driver de Postgres para produccion. En desarrollo se usa SQLite, que viene con Python.
    "psycopg[binary]",
    # Firma de los tokens de sesion.
    "pyjwt",
    # Hash de las contrasenas.
    "bcrypt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

# Sin esto, `pip install .` se topa con app/, alembic/ y docker/ en la raiz, no sabe cual
# es el paquete y se niega a construir. Es lo que hace el Dockerfile, asi que el despliegue
# fallaba antes de empezar.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
