services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGINS: http://localhost:3000
    volumes:
      - ./app:/srv/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tallertrack
      POSTGRES_PASSWORD: tallertrack
      POSTGRES_DB: tallertrack
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data

volumes:
  datos_postgres:
